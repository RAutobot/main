name: Checksum
run-name: Checksum (${{ inputs.strip-abi }})
on:
  workflow_dispatch:
    inputs:
      cookies:
        description: Cookies
      url:
        description: URL
        required: true
      strip-abi:
        description: Strip ABI
        type: boolean

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: printf "%s\n" "FILENAME=$(curl -sSLOJ -w "%{filename_effective}" -b "${{ inputs.cookies }}" "${{ inputs.url }}")" >> "$GITHUB_ENV"

      - name: Checksum
        run: |
          if [[ "${{ inputs.strip-abi }}" == "true" ]]; then
            zip -q -d "$FILENAME" "lib/armeabi-v7a/*" "lib/x86/*" "lib/x86_64/*" "META-INF/*"
          fi

          cksum -a sha256 "$FILENAME"
          7z a -m0=lzma2 -mx=9 -md=256m artifact.7z "$FILENAME"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: artifact.7z
