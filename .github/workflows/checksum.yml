name: Checksum
on:
  workflow_dispatch:
    inputs:
      cookies:
        description: Cookies
      url:
        description: URL
        required: true

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: printf "%s\n" "FILENAME=$(curl -sSLOJ -w "%{filename_effective}" -b "${{ inputs.cookies }}" "${{ inputs.url }}")" >> "$GITHUB_ENV"

      - name: Compute SHA-256
        run: cksum -a sha256 "$FILENAME"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: ${{ env.FILENAME }}
          compression-level: 9
