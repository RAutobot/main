name: Strip ABI
on:
  workflow_dispatch:
    inputs:
      cookies:
        description: Cookies
      url:
        description: URL
        required: true

jobs:
  strip-abi:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: printf "%s\n" "FILENAME=$(curl -sSLOJ -w "%{filename_effective}" -b "${{ inputs.cookies }}" "${{ inputs.url }}")" >> "$GITHUB_ENV"

      - name: Strip and checksum
        run: |
          zip -q -d "$FILENAME" "lib/armeabi-v7a/*" "lib/x86/*" "lib/x86_64/*" "META-INF/*"

          cksum -a sha256 "$FILENAME"
          7z a -m0=lzma2 -mx=9 artifact.7z "$FILENAME"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: artifact.7z
