name: Extract Boot Image
on:
  workflow_dispatch:
    inputs:
     fastboot-rom-url:
        description: Fastboot ROM URL
        required: true

jobs:
  extract-boot-image:
    runs-on: ubuntu-latest
    steps:
      - name: Extract boot image
        run: curl -sSL "${{ inputs.fastboot-rom-url }}" | tar -xz -f - --occurrence --wildcards "*/images/boot.img"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: "*/images/boot.img"
